name: Build locales coverage

on:
  push:
    branches:
      - l10n_master

jobs:
  locales:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.PUSH_TRANSLATIONS_COVERAGE_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Create report file
        run: |
          bun install --frozen-lockfile
          bun run locales-coverage
          FILE_CHANGED=$(git diff packages/excalimove/locales/percentages.json)
          if [ ! -z "${FILE_CHANGED}" ]; then
            git config --global user.name 'Excalidraw Bot'
            git config --global user.email 'bot@excalidraw.com'
            git add packages/excalimove/locales/percentages.json
            git commit -am "Auto commit: Calculate translation coverage"
            git push
          fi
      - name: Construct comment body
        id: getCommentBody
        run: |
          body=$(bun run locales-coverage:description | grep '^[^>]')
          body="${body//'%'/'%25'}"
          body="${body//$'\n'/'%0A'}"
          body="${body//$'\r'/'%0D'}"
          echo ::set-output name=body::$body

      - name: Update description with coverage
        uses: kt3k/update-pr-description@1b35a6dcd84d81aa0bc1889610efdcde7f37b0c0 # v1.0.1
        with:
          pr_body: ${{ steps.getCommentBody.outputs.body }}
          pr_title: "chore(editor): Update translations from Crowdin"
          github_token: ${{ secrets.PUSH_TRANSLATIONS_COVERAGE_PAT }}
