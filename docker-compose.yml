services:
  excalimove:
    build:
      context: .
      args:
        - NODE_ENV=development
    container_name: excalimove
    ports:
      - "3000:80"
    restart: on-failure
    stdin_open: true
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/opt/node_app/app:delegated
      - ./package.json:/opt/node_app/package.json
      - ./bun.lock:/opt/node_app/bun.lock
      - notused:/opt/node_app/app/node_modules

volumes:
  notused:
